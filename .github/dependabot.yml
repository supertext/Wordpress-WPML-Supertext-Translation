version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "composer"
    directory: "/tests/unit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # PHPUnit 12 needs PHP 8.3 and 13 needs PHP 8.4; the tests run on PHP 8.2,
      # the oldest version the plugin supports (see tests/README.md).
      - dependency-name: "phpunit/phpunit"
        versions: [">=12"]
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
