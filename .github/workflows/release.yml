name: Release

# Publishes a GitHub release only when the version is officially bumped: a new
# `## X.Y.Z — YYYY-MM-DD` section at the top of CHANGELOG.md (below an empty
# *Unreleased*), with every file in VERSION_FILES carrying the same number.
# Pushes without a new version release nothing; a released version is skipped;
# a version file that doesn't match fails the run. 0.x versions are pre-releases.
# See docs/DEVELOPER.md → Releasing.

on:
  push:
    branches: [ main ]
    paths: [ 'CHANGELOG.md', 'supertext-wpml.php' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The plugin header's "Version:" and the SUPERTEXT_WPML_VERSION constant.
  VERSION_FILES: supertext-wpml.php

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release (gh release create)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version and decide whether to release
        id: check
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+(?= — [0-9]{4}-[0-9]{2}-[0-9]{2})' CHANGELOG.md || true)
          if [ -z "$VERSION" ]; then
            echo "No released version in CHANGELOG.md yet: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in $VERSION_FILES; do
            header=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "$file" | head -1 || true)
            constant=$(grep -oP "SUPERTEXT_WPML_VERSION',\s*'\K[0-9]+\.[0-9]+\.[0-9]+" "$file" | head -1 || true)
            if [ "$header" != "$VERSION" ] || [ "$constant" != "$VERSION" ]; then
              echo "::error file=$file::Version mismatch: CHANGELOG.md says $VERSION, the header says '$header', SUPERTEXT_WPML_VERSION says '$constant'."
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the installable plugin zip and the release notes
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/supertext-wpml
          cp supertext-wpml.php README.md LICENSE CHANGELOG.md build/supertext-wpml/
          cp -r includes assets languages build/supertext-wpml/
          ( cd build && zip -qr "../supertext-wpml-${VERSION}.zip" supertext-wpml )
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish the GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "${VERSION%%.*}" = "0" ]; then prerelease=(--prerelease); fi
          gh release create "v${VERSION}" "supertext-wpml-${VERSION}.zip" \
            --title "v${VERSION}" --notes-file notes.md --target "$GITHUB_SHA" "${prerelease[@]}"
